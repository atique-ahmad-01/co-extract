[project]
name = "co-extract"
version = "0.1.0"
description = "Extract validated JSON from construction change orders"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "anthropic>=2.0",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
